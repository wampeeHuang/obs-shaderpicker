<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS 着色器选型器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
  <h1 id="app-title">OBS Shader Picker</h1>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search effects / params…" autocomplete="off">
  </div>
  <select id="src" class="src-select" title="Apply to source"></select>
  <div id="status" class="status">Connecting OBS…</div>
  <button id="reload-btn" class="lang-btn" title="重新加载面板">⟳</button>
  <button id="settings-btn" class="settings-btn" title="OBS 连接设置">⚙</button>
  <button id="lang-toggle" class="lang-btn" title="Switch language">中文</button>
</header>
<div id="preview" class="preview hidden">
  <img id="preview-img" alt="效果预览">
  <div class="preview-info">
    <span id="preview-name" class="preview-name"></span>
    <span id="preview-file" class="preview-file"></span>
  </div>
</div>
<div class="layout">
  <aside id="cats"></aside>
  <main>
    <div id="toast" class="toast hidden"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">没有匹配的效果</div>
  </main>
  <div id="detail" class="detail hidden">
    <div class="detail-head">
      <span id="detail-title" class="detail-title">效果参数</span>
      <span id="detail-src" class="detail-src"></span>
      <button id="detail-collapse" class="collapse-btn" title="收起参数面板">✕</button>
    </div>
    <div id="detail-body" class="detail-body">
      <div id="params" class="params"><div class="p-empty">点卡片加载参数</div></div>
    </div>
  </div>
</div>
<footer class="foot">
  <a class="foot-btn" href="https://github.com/wampeeHuang/obs-shaderpicker" target="_blank" rel="noopener noreferrer" title="GitHub 仓库：源码 / 下载 / 反馈">
    <svg class="icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    GitHub
  </a>
  <a class="foot-btn" href="https://www.xiaohongshu.com/user/profile/65668681000000003c01c15f" target="_blank" rel="noopener noreferrer" title="小红书：作者账号">
    <svg class="icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <rect width="24" height="24" rx="5.5" fill="#FF2442"/>
      <text x="12" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">小红书</text>
    </svg>
    小红书
  </a>
</footer>
</div>
<div id="fold" class="fold">
  <div class="fold-logo">◧</div>
</div>
<div id="settings-modal" class="settings-modal hidden">
  <div class="settings-box">
    <h2>OBS 连接设置</h2>
    <label>OBS WebSocket 地址<input id="s-url" type="text" placeholder="ws://127.0.0.1:4455"></label>
    <label>WebSocket 密码<input id="s-pass" type="password" placeholder="留空表示未设密码"></label>
    <label>应用到的源名<input id="s-source" type="text" placeholder="摄像头"></label>
    <label>滤镜名<input id="s-filter" type="text" placeholder="用户自定义着色器"></label>
    <label>shader 目录<input id="s-shader" type="text" placeholder="C:/Program Files/obs-studio/data/obs-plugins/obs-shaderfilter/examples/"></label>
    <div class="settings-actions">
      <button id="s-save" class="s-btn primary">保存并连接</button>
      <button id="s-cancel" class="s-btn">取消</button>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
